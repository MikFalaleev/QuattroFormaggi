# Заявки-моки для bench_v2 (D-103): НЕ настоящие заявки. Их написал агент 24.09.2026 по поручению
# пользователя («Настоящие заявки: напиши сам моки»); эталонные карточки тоже разметил агент,
# недостающие поля и каноническую форму ответа посчитал код. Тот же агент писал промпт и
# генератор, поэтому у моков могут быть общие с ними слепые пятна. Моки проверяют устойчивость к
# формулировкам не из шаблонов (сокращения городов, чат, пересланные письма, ставки и номера), но
# качество на настоящих заявках они не измеряют. В записях они synthetic, семейство manual_mock.
# Формат — как в bench_v2_manual.example.yaml; заморозка:
#   uv run qf bench freeze --config configs/eval/benchmark_v2.yaml --manual configs/eval/bench_v2_mock.yaml
# Компании вымышленные, персональных данных нет.

