    электроника. Нужна особая упаковка. Загрузка завтра.
  card:
    shipper_name: null
    cargo_category: electronics
    equipment_type: van
    pieces: 6
    weight_total: {value: 800, unit: kg}
    weight_per_piece: null
    origin: {city: Самара, region: Самарская область}
    destination: {city: Уфа, region: Республика Башкортостан}
    pickup_date: 2026-09-22
    delivery_date: null
    special_conditions:
      - {kind: packaging, types: []}    # названо без значений -> в недостающие
