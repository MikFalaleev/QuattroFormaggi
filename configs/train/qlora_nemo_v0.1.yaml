# Step 12: QLoRA of the pinned Mistral-Nemo on generated_v2 (card_v2), one epoch — the pilot of
# step 14. Schema: development plan §10, pinned (D-114). Before the run (plan step 13, ⛔ STOP):
#   uv run qf train estimate                       # steps, tokens, memory; cost after tokens/s
#   uv run qf train run --max-steps 15 --save-every 5 --eval-every 5   # GPU smoke, 15 steps
#   uv run qf train run                            # the pilot, after the user's approval
run_name: qf-12b-logistics-v0.1
seed: 42
model:
  id: mistralai/Mistral-Nemo-Instruct-2407
  revision: 04d8a90549d23fc6bd7f642064003592df51e9b3   # = configs/train/base_model.yaml
  base_model_config: configs/train/base_model.yaml
  preserve_tokenizer: true
  preserve_chat_template: true
quantization:
  load_in_4bit: true
  type: nf4
  double_quant: true
  # an explicit choice (never "bfloat16_if_supported"): A100 and H100 support bf16; confirmed on the
  # machine by test_gpu_bf16_decision at step 13
  compute_dtype: bf16
lora:
  rank: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
data:
  train_path: data/processed/generated_v2/train.jsonl   # 1500 records (E200)
  val_path: data/processed/generated_v2/val.jsonl       # 150 records
  expected_sha256:
    train: 968c144affeffc9b733f0a249832284e75caa97359a0ae11b2e85dd70c6f72db
    val: 731a1c5badc242f753f4b819dba8046f53acd05740f457206eb79c5da3c71916
training:
  max_sequence_length: 2048          # the longest record is 1439 tokens (E200): none skipped
  micro_batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 1.0e-4
  epochs: 1
  max_steps: 94                      # = ceil(1500 / (1 × 16)) × 1: exactly one epoch
  max_wall_time_minutes: 120         # a ceiling, not an estimate; refined after step 13
  warmup_ratio: 0.03
  lr_scheduler: cosine
  max_grad_norm: 1.0
  gradient_checkpointing: true
  use_cache: false
  packing: false
  loss_scope: assistant_tokens_only
  # denser than §10's 50: nine val points over 94 steps for the loss curve and the stop rule of
  # step 14; ten checkpoints of ~0.7 GB are kept so any of them can be chosen (D-116)
  checkpoint_every_optimizer_steps: 10
  evaluate_every_optimizer_steps: 10
  keep_checkpoints: 10
logging:
  external_reporting: false
  record_peak_memory: true
budget:
  gpu_hourly_rate: 368.18            # Immers.cloud h100nvl-1.16.96.240 + IP, per-second billing (28.09.2026, D-119)
  measured_tokens_per_s: null        # measured by the GPU smoke run (step 13)
  max_cost: 740                      # the training loop only: 120 min × 368.18 = 736.36 (D-119)
  currency: RUB
  overhead_factor: 1.3
output:
  run_root: runs
trainer:
  name: hf_trainer_qlora
  loader: cuda_4bit
