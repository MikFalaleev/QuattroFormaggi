# Step 18: `qf extract` on the local model (docs/EVAL_SPEC.md, «Условия запуска»).
# LM Studio 0.4.25+1, model loaded with:  lms load <identifier> --context-length 4096 --gpu max --parallel 1
# and the server started with:            lms server start --port 1234 --bind 127.0.0.1
backend:
  name: openai_local
  base_url: http://127.0.0.1:1234/v1     # loopback only; no fallback URL
  model_substring: quattro-formaggi      # resolved from /v1/models, never from a file name
  timeout_s: 180
  stream: false
  expected_context: 4096
schema_version: card_v2
task: shipment_extraction
settings:
  max_tokens: 768
  temperature: 0.0
  json_schema: false                     # the gate mode (D-112): no constrained decoding
